title: jhill-did.github.io
description: >-
  A technical blog for notes, experiments, and write-ups on software,
  infrastructure, and development workflows.
url: "https://jhill-did.github.io"
baseurl: ""
lang: en
timezone: UTC

theme: minima

markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/
show_excerpts: true
future: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

author:
  name: Your Name
  email: you@example.com

minima:
  social_links:
    - title: GitHub
      icon: github
      url: https://github.com/jhill-did
    - title: LinkedIn
      icon: linkedin
      url: https://www.linkedin.com/in/your-profile/

header_pages:
  - about.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
